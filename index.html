<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC Walk">
<title>BTC Walk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=27">
</head>
<body>
<header class="bar">
  <span class="logo">BTC</span>
  <span class="app">Walk</span>
  <button type="button" class="proj" id="proj" aria-label="Project">…</button>
  <button type="button" class="cxchip" id="cxchip" aria-label="Commissioning: tap to switch back" hidden>CX</button>
  <span class="fill"></span>
  <button type="button" class="icon" id="find" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  <button type="button" class="icon dots" id="more" aria-label="Settings">⋮</button>
</header>
<button type="button" class="cxband" id="cxband" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>COMMISSIONING</button>
<main id="main"></main>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="photo-in" accept="image/*" capture="environment" hidden>
<input type="file" id="pics-in" accept="image/*" multiple hidden>
<input type="file" id="proj-in" hidden>
<script src="app.js?v=36"></script>
</body>
</html>
